name: Bug report
description: Something is wrong in a game or in the launcher
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach game files**: no disc images, EBOOTs, generated C, memory dumps, or screenshots / videos of the
        game. They will be deleted. Describe what you see in words and attach the log and input files instead.
  - type: dropdown
    id: game
    attributes:
      label: Game
      options: [Chains of Olympus, Ghost of Sparta, Launcher only]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Launcher release (e.g. v1.1.5, shown in the ZIP's README.txt) or commit
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Level / area, what you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Log and recorded input
      description: |
        Right after the bug, press **Report a bug** in the launcher and drag the zip it makes in here (it holds the
        log, your button presses, frame timings, settings and PC info; no game files). Without it most bugs can't be
        found. Or attach
        `GoW_PSP_data\build\launcher_coo.log` and `launcher_coo_input.txt`
        (`launcher_gos.*` for Ghost of Sparta). The next Play overwrites them. They only hold the game's log and
        your button presses. Say whether you started a new game or loaded a save. From the command line, use
        `--record-input input.txt` instead.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: PC and settings
      description: GPU, Windows version, display scaling, the graphics preset or options you changed; keyboard or which gamepad.
      render: text
