name: "Relatar um erro / Report a bug"
description: "Informe um problema no Android / Report an Android issue"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **🇧🇷 Português:** Descreva o problema e não anexe ISO, arquivos do jogo, dumps de memória ou conteúdo protegido por direitos autorais. Inclua apenas logs técnicos seguros.

        **🇺🇸 English:** Describe the issue. Do not attach ISO files, game files, memory dumps, or copyrighted content. Include only safe technical logs.
  - type: input
    id: device
    attributes:
      label: "Aparelho / Device"
      description: "Modelo do aparelho e GPU, se souber / Device model and GPU, if known"
      placeholder: "Moto G35 5G"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: "Versão do Android / Android version"
      placeholder: "Android 15"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: "Versão do aplicativo / App version"
      description: "Versão ou tag instalada / Installed version or tag"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "O que aconteceu? / What happened?"
      description: "O que você fez, o que esperava e o que aconteceu / Steps, expected result, and actual result"
      placeholder: "Descreva o problema / Describe the issue"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Como reproduzir / Steps to reproduce"
      placeholder: "1. ...\n2. ...\n3. ..."
  - type: textarea
    id: logs
    attributes:
      label: "Logs técnicos / Technical logs"
      description: "Remova dados pessoais. Nunca envie arquivos do jogo / Remove personal data. Never upload game files."
      render: text
