name: Publish Android APK Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (use a new tag for each version)"
        required: true
        type: string
        default: "android-v0.1.0"
      target_branch:
        description: "Branch whose code this release represents"
        required: true
        type: string
        default: "android"
      release_title:
        description: "Title shown on the GitHub Release"
        required: true
        type: string
        default: "God of War PSP Recomp Android — v0.1.0"
      apk_url:
        description: "Direct HTTPS download URL of the tested APK (not a webpage)"
        required: true
        type: string
        default: "https://github.com/flavinxs0/gow-psp-recomp-android/releases/download/android-v0.1.0/God.of.War.PSP.Recomp"
      prerelease:
        description: "Mark as a pre-release / testing build"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input and download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        shell: bash
        run: |
          set -euo pipefail
          case "$APK_URL" in
            https://*) ;;
            *) echo "apk_url must be a direct HTTPS download URL." >&2; exit 1 ;;
          esac
          mkdir -p release
          curl --fail --location --retry 3 --output release/GodOfWar-PSP-Recomp-Android.apk "$APK_URL"
          if [ ! -s release/GodOfWar-PSP-Recomp-Android.apk ]; then
            echo "Downloaded APK is empty." >&2
            exit 1
          fi
          if ! unzip -tq release/GodOfWar-PSP-Recomp-Android.apk >/dev/null; then
            echo "The downloaded file is not a valid APK/ZIP archive." >&2
            exit 1
          fi
          if ! unzip -Z1 release/GodOfWar-PSP-Recomp-Android.apk | grep -qx 'AndroidManifest.xml'; then
            echo "The archive does not contain AndroidManifest.xml; refusing to publish it as an APK." >&2
            exit 1
          fi
          sha256sum release/GodOfWar-PSP-Recomp-Android.apk | tee release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ inputs.target_branch }}
          name: ${{ inputs.release_title }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            ## First Android APK release

            This release publishes an Android APK for the God of War PSP Recomp Android project.

            ### Important
            - This is an initial testing release; compatibility and stability may vary by device.
            - The APK is supplied to this workflow by a direct HTTPS download URL and is checked for basic APK archive structure before publication.
            - The SHA-256 checksum is included as `SHA256SUMS.txt`.
            - No game disc image or proprietary game data is included. Use only game data you are legally entitled to use.

            ### Reporting issues
            Please open an issue with your device model, Android version, steps to reproduce, and relevant logs. Do not upload game disc images or proprietary game files.
          files: |
            release/GodOfWar-PSP-Recomp-Android.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
