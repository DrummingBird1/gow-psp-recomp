name: Android source smoke validation

on:
  push:
    branches: [fix/movie-refresh-isolation]
    paths:
      - ".github/workflows/android-source-smoke.yml"
      - "runtime/**"
      - "android/launcher/**"
      - "tools/install_android_launcher.py"
      - "CMakeLists.txt"
  pull_request:
    branches: [android]
    paths:
      - ".github/workflows/android-source-smoke.yml"
      - "runtime/**"
      - "android/launcher/**"
      - "tools/install_android_launcher.py"
      - "CMakeLists.txt"

permissions:
  contents: read

env:
  SDL_COMMIT: fa2c02bb6e21974a89ea9824bc53c9932abe5f9c

jobs:
  native-runtime:
    name: Compile Android ARM64 runtime without game data
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: ${{ env.SDL_COMMIT }}
          path: SDL

      - name: Assert requested runtime safeguards are present
        run: |
          grep -Fq 'rt_display_set_hz(on ? 59.94 : g_gameplay_hz)' runtime/rt_host.c
          grep -Fq 'getWindow().getDecorView().post(this::enterImmersiveMode)' android/launcher/src/main/java/org/gow/shell/GameActivity.java

      - name: Create harmless generated-source stub
        run: |
          mkdir -p build/gen/UCUS98653_full
          printf 'int gow_smoke_generated_source(void) { return 0; }\n' > build/gen/UCUS98653_full/smoke_stub.c

      - name: Build SDL3 for Android ARM64
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          cmake -S SDL -B build-sdl -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build build-sdl --parallel
          test -s build-sdl/libSDL3.so

      - name: Compile native runtime with stub guest code
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          AR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          mkdir -p stubs build/deps
          "$AR" rc stubs/libpthread.a
          "$AR" rc stubs/librt.a
          ln -sfn "$PWD/SDL" "build/deps/SDL3-${SDL_COMMIT}"
          touch "build/deps/SDL3-${SDL_COMMIT}/.gow_complete"
          cmake -S . -B build/cmake_smoke -G Ninja \
            -DFETCHCONTENT_SOURCE_DIR_SDL3="$PWD/SDL" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release -DGAME=UCUS98653_full -DGOW_ANDROID=ON \
            -DGOW_SDL_SO="$PWD/build-sdl/libSDL3.so" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L$PWD/stubs"
          cmake --build build/cmake_smoke --parallel
          MAIN="$(find build/cmake_smoke -name libmain.so -type f -print -quit)"
          test -s "$MAIN"
          file "$MAIN"

  android-launcher:
    name: Compile Android launcher and gameplay activity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: ${{ env.SDL_COMMIT }}
          path: SDL

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate disposable SDL Android project
        run: |
          printf '#include <SDL3/SDL_main.h>\nint main(int argc, char **argv) { (void)argc; (void)argv; return 0; }\n' > stub.c
          python3 SDL/build-scripts/create-android-project.py org.gow.shell stub.c --output "$RUNNER_TEMP/gow-android-project"
          python3 tools/install_android_launcher.py "$RUNNER_TEMP/gow-android-project/org.gow.shell"

      - name: Build launcher smoke APK (stub runtime only)
        run: |
          cd "$RUNNER_TEMP/gow-android-project/org.gow.shell"
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk
